    # -------------------------------------------------------------------------
    # Device Fleet & Sync DTOs
    # -------------------------------------------------------------------------
    DeviceSummary:
      type: object
      required:
        - id
        - serialNumber
        - macAddress
        - calibrationGain
        - lastBatteryPct
        - lastSeenAt
        - lastSyncAt
        - failedCount
        - continuity
      properties:
        id:
          type: string
          format: uuid
        serialNumber:
          type: string
          example: "DSFAV-UNIT-01"
        macAddress:
          type: string
          example: "AA:BB:CC:DD:EE:01"
        calibrationGain:
          type: number
          example: 1.0
        lastBatteryPct:
          type: integer
          example: 95
        lastSeenAt:
          type: string
          format: date-time
        lastSyncAt:
          type: [string, "null"]
          format: date-time
        failedCount:
          type: integer
          minimum: 0
        continuity:
          type: object
          required: [uniquePatients, crossDevicePatients]
          properties:
            uniquePatients:
              type: integer
              minimum: 0
              description: Number of distinct pseudonymous patients measured with this device.
            crossDevicePatients:
              type: integer
              minimum: 0
              description: Number of those patients measured with more than one device.

    DeviceSyncRequest:
      type: object
      required:
        - deviceSerial
        - batteryPct
        - items
      properties:
        deviceSerial:
          type: string
          example: "DSFAV-UNIT-01"
        batteryPct:
          type: integer
          example: 85
        items:
          type: array
          items:
            type: object
            required:
              - idempotencyKey
            properties:
              idempotencyKey:
                type: string
              idPseudo:
                type: [string, "null"]
              recordedAt:
                type: string
                format: date-time
              avgPressureKpa:
                type: number
              captureDurationSec:
                type: number
              cleanDurationSec:
                type: number
              status:
                $ref: "#/components/schemas/Status"
              rejectReason:
                $ref: "#/components/schemas/RejectReason"

    DeviceSyncResponse:
      type: object
      required:
        - syncedCount
        - failedCount
        - results
      properties:
        syncedCount:
          type: integer
        failedCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSyncItemResult"

    DeviceSyncItemResult:
      type: object
      required: [idempotencyKey, state, error]
      properties:
        idempotencyKey:
          type: string
        state:
          $ref: "#/components/schemas/SyncState"
        error:
          type: [string, "null"]
        measurement:
          $ref: "#/components/schemas/MeasurementResultDto"

    # -------------------------------------------------------------------------
    # Training Bench DTOs
    # -------------------------------------------------------------------------
    BenchSessionSummary:
      type: object
      required:
        - id
        - internId
        - pumpFlowMlMin
        - clampStenosisPct
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        internId:
          type: string
          format: uuid
        measurementId:
          type: [string, "null"]
          format: uuid
        pumpFlowMlMin:
          type: number
          example: 450
        clampStenosisPct:
          type: integer
          enum: [0, 30, 50, 75]
          example: 30
        perceivedThrill:
          oneOf:
            - $ref: "#/components/schemas/PerceivedThrill"
            - type: "null"
        perceivedIntensity:
          type: [integer, "null"]
          example: 3
        concordanceScore:
          type: [number, "null"]
          example: 85.0
        createdAt:
          type: string
          format: date-time

    BenchSessionResult:
      type: object
      required:
        - sessionId
        - internId
        - measurementId
        - pumpFlowMlMin
        - clampStenosisPct
        - perceivedThrill
        - perceivedIntensity
        - concordanceScore
        - expectedProfile
        - concordanceBreakdown
        - disclaimer
      properties:
        sessionId:
          type: string
          format: uuid
        internId:
          type: string
          format: uuid
        measurementId:
          type: string
          format: uuid
        pumpFlowMlMin:
          type: number
          example: 450
        clampStenosisPct:
          type: integer
          example: 30
        perceivedThrill:
          $ref: "#/components/schemas/PerceivedThrill"
        perceivedIntensity:
          type: integer
          example: 3
        concordanceScore:
          type: number
          example: 85.0
        expectedProfile:
          type: string
          example: "SYSTOLIC_ROUGH"
        concordanceBreakdown:
          type: object
          properties:
            sensationScorePct:
              type: number
              example: 60.0
            intensityScorePct:
              type: number
              example: 25.0
            notesScorePct:
              type: number
              example: 15.0
        internNotes:
          type: [string, "null"]
          example: "Observation d'une turbulence accentuée en systole"
        disclaimer:
          type: string
          example: "Simulation sur banc, pas de donnée patient"

